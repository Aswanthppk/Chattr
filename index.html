<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Random Chat – Talk to New People Online | Chattr.</title>
    <meta name="description" content="Meet new people through random chat. Choose your interests, get matched with someone online, and start a conversation in seconds." />
    <link rel="canonical" href="https://chattr.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Random Chat – Talk to New People Online | Chattr." />
    <meta property="og:description" content="Meet new people through random chat. Choose your interests, get matched with someone online, and start a conversation in seconds." />
    <meta property="og:url" content="https://chattr.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chattr." />
    <meta property="og:image" content="https://chattr.app/og-image.svg" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Random Chat – Talk to New People Online | Chattr." />
    <meta name="twitter:description" content="Meet new people through random chat. Choose your interests, get matched with someone online, and start a conversation in seconds." />
    <meta name="twitter:image" content="https://chattr.app/og-image.svg" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/chattr-icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/chattr-icon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/chattr-icon-180x180.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5146d0" />

    <!-- Structured Data (JSON-LD) for SoftwareApplication, WebSite, and Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Chattr.",
          "url": "https://chattr.app",
          "description": "A simple random chat application for meeting new people online."
        },
        {
          "@type": "Organization",
          "name": "Chattr.",
          "url": "https://chattr.app",
          "logo": "https://chattr.app/og-image.svg"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Chattr.",
          "applicationCategory": "SocialNetworkingApplication",
          "operatingSystem": "Web",
          "description": "A simple random chat application for meeting new people online."
        }
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <body class="bg-[#f9f9f7] font-sans antialiased text-[#111111] selection:bg-[#e3dfff] selection:text-[#5146d0]">
