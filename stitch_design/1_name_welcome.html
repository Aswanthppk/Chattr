<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed": "#191a2b", "primary-container": "#1c1b1b", "surface-container-highest": "#e2e3e1", "secondary": "#5146d0", "primary-fixed": "#e5e2e1", "on-error-container": "#93000a", "outline-variant": "#c4c7c7", "surface-bright": "#f9f9f7", "on-error": "#ffffff", "surface-dim": "#dadad8", "on-surface": "#1a1c1b", "inverse-surface": "#2f3130", "surface-container-high": "#e8e8e6", "on-primary-fixed": "#1c1b1b", "on-secondary": "#ffffff", "state-success": "#42C77A", "tertiary": "#000000", "text-secondary": "#6F6F73", "on-primary-fixed-variant": "#474646", "state-danger": "#E85D5D", "surface-container-lowest": "#ffffff", "background": "#f9f9f7", "error": "#ba1a1a", "orb-gradient-start": "#8D8BFF", "surface": "#FFFFFF", "text-primary": "#111111", "inverse-on-surface": "#f1f1ef", "surface-container-low": "#f4f4f2", "surface-tint": "#5f5e5e", "text-muted": "#9A9A9F", "on-surface-variant": "#444748", "on-secondary-container": "#fffbff", "on-secondary-fixed-variant": "#3b2bba", "outline": "#747878", "surface-container": "#eeeeec", "border-subtle": "#E8E8E8", "orb-gradient-end": "#6D72E8", "orb-gradient-mid": "#C9C8FF", "on-primary-container": "#858383", "surface-dark": "#171717", "secondary-fixed": "#e3dfff", "on-tertiary": "#ffffff", "primary-fixed-dim": "#c8c6c5", "tertiary-fixed-dim": "#c5c4dc", "on-tertiary-fixed-variant": "#444558", "surface-variant": "#e2e3e1", "primary": "#000000", "on-ba Height": "24px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-background font-body-md text-body-md text-text-primary min-h-screen flex flex-col antialiased"><main class="flex-1 w-full bg-background flex flex-col pt-safe pb-safe"><div class="flex flex-col w-full px-margin pb-safe justify-between min-h-[calc(100vh-theme(spacing.space-2xl))]">
<!-- Minimal Top Header -->
<header class="flex items-center justify-between pt-space-md">
<div class="flex items-center gap-space-xs">
<div class="w-6 h-6 rounded-full shadow-sm flex items-center justify-center p-0.5 bg-gradient-to-tr from-orb-gradient-end via-orb-gradient-start to-orb-gradient-mid">
<div class="w-full h-full rounded-full bg-surface-bright/40 backdrop-blur-sm"></div>
</div>
<span class="font-headline-sm text-headline-sm tracking-tight text-text-primary uppercase">Geist</span>
</div>
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface shadow-sm">
<span class="w-2 h-2 rounded-full bg-state-success animate-pulse"></span>
<span class="font-caption text-caption text-text-secondary font-medium">1,420 online</span>
</div>
</header>
<!-- Center Hero: Luminous Glass Orb Experience -->
<div class="flex flex-col items-center justify-center my-auto py-space-md select-none relative">
<!-- Ambient Diffused Glow Rings -->
<div class="absolute w-72 h-72 rounded-full bg-orb-gradient-start/15 blur-3xl pointer-events-none -z-10 animate-pulse" style="animation-duration: 4s;"></div>
<div class="absolute w-56 h-56 rounded-full bg-orb-gradient-mid/25 blur-2xl pointer-events-none -z-10"></div>
<!-- Outer Concentric Subtle Ring -->
<div class="relative flex items-center justify-center p-5 rounded-full bg-surface-container-low/70 shadow-sm transition-transform duration-700 hover:scale-105">
<!-- Glossy 3D Lavender Orb Identity -->
<div class="relative w-44 h-44 rounded-full shadow-2xl flex items-center justify-center overflow-hidden bg-gradient-to-br from-orb-gradient-start via-orb-gradient-mid to-orb-gradient-end">
<!-- Inner Specular Light & Reflection Sheen -->
<div class="absolute -top-10 -left-6 w-36 h-36 rounded-full bg-white/45 blur-md pointer-events-none transform -rotate-12"></div>
<div class="absolute inset-0 rounded-full shadow-[inset_0_2px_12px_rgba(255,255,255,0.7)] pointer-events-none"></div>
<div class="absolute bottom-2 right-4 w-20 h-10 rounded-full bg-secondary-fixed/40 blur-lg pointer-events-none"></div>
<!-- Dynamic Micro Ambient Wave / Energy Core -->
<div class="w-24 h-24 rounded-full bg-gradient-to-tr from-secondary/30 via-white/20 to-transparent blur-sm animate-spin" style="animation-duration: 16s;"></div>
</div>
</div>
<!-- Editorial Typography Block -->
<div class="mt-space-lg text-center space-y-space-xs">
<h1 class="font-display-hero-mobile text-display-hero-mobile text-text-primary tracking-tight font-semibold">
        Meet someone new.
      </h1>
<p class="font-body-md text-body-md text-text-secondary max-w-[280px] mx-auto">
        Start a random conversation in seconds.
      </p>
</div>
</div>
<!-- Ultra-Simple Input & Action Section -->
<div class="flex flex-col space-y-space-md w-full max-w-sm mx-auto">
<!-- Elevated Minimal Input Card -->
<div class="bg-surface rounded-lg p-space-md shadow-sm space-y-space-xs flex flex-col justify-center transition-all focus-within:shadow-md focus-within:ring-2 focus-within:ring-secondary/20">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-text-secondary font-medium" for="userName">
          What should we call you?
        </label>
<span class="font-caption text-caption text-text-muted">Pseudonym ok</span>
</div>
<div class="relative flex items-center">
<input autocomplete="off" autocorrect="off" class="w-full font-body-lg text-body-lg text-text-primary bg-transparent outline-none placeholder:text-text-muted/60 py-1" id="userName" maxlength="24" placeholder="e.g. Sam, River, or Alex" spellcheck="false" type="text"/>
<button class="p-1.5 rounded-full text-text-muted hover:text-text-primary transition-colors flex items-center justify-center active:scale-95" id="diceBtn" title="Surprise me with a pseudonym" type="button">
<span class="material-symbols-outlined text-[20px]">casino</span>
</button>
</div>
</div>
<!-- Quick Micro Identity Chips -->
<div class="flex items-center justify-center gap-2 overflow-x-auto py-0.5 no-scrollbar">
<button class="preset-pill px-3 py-1 rounded-full bg-surface text-text-secondary font-caption text-caption shadow-sm hover:bg-secondary-fixed hover:text-secondary transition-colors" data-name="Nomad" type="button">
        Nomad
      </button>
<button class="preset-pill px-3 py-1 rounded-full bg-surface text-text-secondary font-caption text-caption shadow-sm hover:bg-secondary-fixed hover:text-secondary transition-colors" data-name="Cosmos" type="button">
        Cosmos
      </button>
<button class="preset-pill px-3 py-1 rounded-full bg-surface text-text-secondary font-caption text-caption shadow-sm hover:bg-secondary-fixed hover:text-secondary transition-colors" data-name="Echo" type="button">
        Echo
      </button>
<button class="preset-pill px-3 py-1 rounded-full bg-surface text-text-secondary font-caption text-caption shadow-sm hover:bg-secondary-fixed hover:text-secondary transition-colors" data-name="Sol" type="button">
        Sol
      </button>
</div>
<!-- Primary Action Button -->
<button class="group w-full h-[52px] rounded-full bg-primary text-on-primary font-body-lg text-body-lg font-medium flex items-center justify-center gap-2 shadow-md hover:opacity-95 active:scale-[0.99] transition-all" id="continueBtn" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
<!-- Subtle Privacy Guarantee Footnote -->
<div class="flex flex-col items-center text-center pt-space-xs pb-space-sm space-y-1">
<div class="flex items-center gap-1.5 text-text-secondary font-caption text-caption">
<span class="material-symbols-outlined text-[14px]">lock_reset</span>
<span>No account needed • Ephemeral by default</span>
</div>
<p class="font-caption text-caption text-text-muted">
        Conversations vanish automatically when you leave.
      </p>
</div>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('userName');
    const diceBtn = document.getElementById('diceBtn');
    const continueBtn = document.getElementById('continueBtn');
    const presets = document.querySelectorAll('.preset-pill');

    const randomNames = [
      'Rowan', 'Kei', 'Solstice', 'Lumen', 'Jules', 'Indigo', 'Aura', 
      'Pari', 'Atlas', 'Zephyr', 'Nova', 'Ellis', 'Clover', 'Koa'
    ];

    function getRandomName() {
      return randomNames[Math.floor(Math.random() * randomNames.length)];
    }

    if (diceBtn && input) {
      diceBtn.addEventListener('click', () => {
        diceBtn.classList.add('rotate-180');
        setTimeout(() => diceBtn.classList.remove('rotate-180'), 300);
        input.value = getRandomName();
        input.focus();
      });
    }

    presets.forEach(pill => {
      pill.addEventListener('click', (e) => {
        const val = e.currentTarget.getAttribute('data-name');
        if (input && val) {
          input.value = val;
          input.focus();
        }
      });
    });

    if (continueBtn && input) {
      continueBtn.addEventListener('click', () => {
        if (!input.value.trim()) {
          input.value = getRandomName();
        }
        continueBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Finding someone...</span>';
        continueBtn.disabled = true;
      });
    }
  })();
</script></main></body></html>
