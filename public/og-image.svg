<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f9f9f7"/>
      <stop offset="100%" stop-color="#f0f0eb"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#C9C8FF"/>
      <stop offset="40%" stop-color="#8D8BFF"/>
      <stop offset="70%" stop-color="#6D72E8"/>
      <stop offset="100%" stop-color="#5146D0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#5146D0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient background glow rings -->
  <circle cx="920" cy="315" r="260" fill="#E8E7FF" opacity="0.6" filter="url(#glow)"/>

  <!-- Left Content Column -->
  <g transform="translate(100, 110)">
    <!-- Brand Pill -->
    <rect width="145" height="42" rx="21" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1.5"/>
    <circle cx="24" cy="21" r="7" fill="#10B981"/>
    <text x="40" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111111">Chattr.</text>

    <!-- Main Title -->
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#111111" letter-spacing="-1.5">
      Meet someone new.
    </text>

    <!-- Subtitle -->
    <text x="0" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#555555">
      Start a random conversation with someone online in seconds.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="210" height="48" rx="24" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
      <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#444444">✦ No account needed</text>

      <rect x="226" y="0" width="220" height="48" rx="24" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
      <text x="250" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#444444">✦ Interest matchmaking</text>

      <rect x="462" y="0" width="180" height="48" rx="24" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="1"/>
      <text x="486" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#444444">✦ 100% Ephemeral</text>
    </g>

    <!-- Domain link -->
    <text x="0" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#5146D0">
      chattr.app
    </text>
  </g>

  <!-- Right Visual: The Signature Stitch Catalyst Orb -->
  <g transform="translate(920, 315)">
    <!-- Outer Ping Ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#6D72E8" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#6D72E8" stroke-width="0.8" opacity="0.2"/>

    <!-- Orb Core -->
    <circle cx="0" cy="0" r="140" fill="url(#orbGrad)" filter="url(#shadow)"/>

    <!-- Gloss Specular Highlight -->
    <ellipse cx="-45" cy="-55" rx="75" ry="45" fill="#FFFFFF" opacity="0.4" transform="rotate(-25 -45 -55)"/>

    <!-- Central Initial / Sparkle Icon -->
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.95">C</text>
  </g>
</svg>
